
name: Xbox 360 Cube Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 \
            cmake ninja-build git gawk

      - name: Download XSDK
        run: |
          git clone --depth 1 \
            https://github.com/xenosworks/xsdk.git xsdk

      - name: Build Xbox 360 toolchain
        shell: bash
        run: |
          set -e
          cd xsdk

          chmod +x tools/toolchain/build.sh

          export PREFIX="$HOME/xsdk-gcc"
          export WORK="$HOME/xsdk-gcc-work"
          export JOBS=2

          bash tools/toolchain/build.sh

      - name: Build compatible glslang
        shell: bash
        run: |
          set -e

          git clone --depth 1 --branch xenon \
            https://github.com/xenosworks/glslang-xenon.git \
            glslang-xenon

          cd glslang-xenon

          python3 update_glslang_sources.py

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_OPT=ON \
            -DSPIRV_SKIP_EXECUTABLES=ON \
            -DGLSLANG_TESTS=OFF

          cmake --build build -j2

          mkdir -p "$HOME/xsdk-gcc/bin"
          cp build/StandAlone/glslang \
            "$HOME/xsdk-gcc/bin/glslang"

          chmod +x "$HOME/xsdk-gcc/bin/glslang"
          echo "$HOME/xsdk-gcc/bin" >> "$GITHUB_PATH"

          "$HOME/xsdk-gcc/bin/glslang" --version

      - name: Build XSDK
        shell: bash
        run: |
          set -e
          cd xsdk

          make -j2 TOOLCHAIN="$HOME/xsdk-gcc"

      - name: Build sample projects
        shell: bash
        run: |
          set -e
          cd xsdk

          make samples -j2 TOOLCHAIN="$HOME/xsdk-gcc"

      - name: Find generated XEX files
        shell: bash
        run: |
          set -e

          find xsdk -type f -iname '*.xex' -print \
            | tee xex-files.txt

          if ! grep -q '\.xex$' xex-files.txt; then
            echo "ERROR: No XEX files were generated."
            exit 1
          fi

      - name: Upload generated XEX files
        uses: actions/upload-artifact@v4
        with:
          name: Xbox360-Cube-Test-XEX
          path: |
            xsdk/**/*.xex
            xsdk/*.xex
          if-no-files-found: error
